# Run the module's browser tests with:
# ========================================================================= #
# chromedriver
# vendor/bin/behat-ss @elemental-stylings
# ========================================================================= #
default:
  suites:
    elemental-stylings:
      paths:
        - '%paths.modules.elemental-stylings%/tests/Behat/features'
      contexts:
        - Fractas\ElementalStylings\Tests\Behat\Context\FeatureContext
        - SilverStripe\Framework\Tests\Behaviour\CmsFormsContext
        - SilverStripe\Framework\Tests\Behaviour\CmsUiContext
        - SilverStripe\BehatExtension\Context\BasicContext
        - SilverStripe\BehatExtension\Context\LoginContext
        - SilverStripe\CMS\Tests\Behaviour\AnchorContext
        -
          SilverStripe\BehatExtension\Context\FixtureContext:
            - '%paths.modules.elemental-stylings%/tests/Behat/files'
        -
          SilverStripe\Framework\Tests\Behaviour\ConfigContext:
            - '%paths.modules.elemental-stylings%/tests/Behat/config'
  extensions:
    SilverStripe\BehatExtension\MinkExtension:
      default_session: facebook_web_driver
      javascript_session: facebook_web_driver
      facebook_web_driver:
        browser: chrome
        wd_host: "http://127.0.0.1:9515" #chromedriver port
      browser_name: chrome
    SilverStripe\BehatExtension\Extension:
      bootstrap_file: vendor/silverstripe/cms/tests/behat/serve-bootstrap.php
      screenshot_path: '%paths.base%/artifacts/screenshots'
      retry_seconds: 4 # default is 2
